<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1C1726">
  <!-- Paint the page dark straight away, before anything else loads, so it never flashes white. -->
  <style>html, body { background: #1C1726; color: #E6DCC6; }</style>
  <title>The 10pm Room</title>
  <meta name="description" content="A website that's only open from 10pm to 3am, UK time.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C1726'/%3E%3Ctext x='16' y='22' font-family='Arial Narrow,Arial,sans-serif' font-weight='700' font-size='16' text-anchor='middle' fill='%23EDB65C'%3E10%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body data-state="loading">
  <main>
    <p class="name">The 10pm Room</p>

    <section id="closed" class="closed" hidden>
      <h1 class="giant" aria-label="Closed until 10pm">10:00</h1>
      <p class="lead" id="aftermath" hidden>Closed for tonight. See you tomorrow.</p>
      <p class="lead">Open every night from 10pm to 3am, UK time.</p>
      <p class="yours" id="yours"></p>
      <p class="countdown" id="countdown"></p>
    </section>

    <section id="open" class="open" hidden>
      <h1 class="giant" id="left" aria-describedby="left-label">5:00:00</h1>
      <p class="left-label" id="left-label">until it closes</p>

      <p class="lead">Leave one line for whoever turns up tomorrow night.</p>

      <form id="form" class="form" autocomplete="off">
        <label for="note" class="visually-hidden">Your note</label>
        <textarea id="note" name="note" maxlength="140" rows="2" placeholder="Say something to tomorrow night" required></textarea>
        <div class="form-row">
          <span id="count" class="count">140 characters left</span>
          <button type="submit" id="leave">Leave note</button>
        </div>
      </form>
      <p id="formmsg" class="formmsg" role="status"></p>

      <h2>Tonight</h2>
      <ol id="tonight" class="notes"></ol>
      <p id="tonight-empty" class="empty">Nothing yet.</p>

      <h2>Last night</h2>
      <ol id="lastnight" class="notes"></ol>
      <p id="lastnight-empty" class="empty">Nobody left anything.</p>
    </section>

    <p id="notice" class="notice" hidden></p>
  </main>
</body>
</html>
